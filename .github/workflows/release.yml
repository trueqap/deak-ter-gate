name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # Runs on every push to main (and on manual runs). CI and the release
  # below only run when the plugin header carries a version that has no
  # GitHub release yet, so a follow-up fix can still complete a release.
  precheck:
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.check.outputs.release_needed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Is this version already released?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 "Version:" deak-ter-gate.php | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released - nothing to do"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION has no release yet - running CI and the release"
          fi

  # The same checks as CI. A release, and the tag it creates, only happen
  # when all of them pass.
  ci:
    needs: precheck
    if: needs.precheck.outputs.release_needed == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from plugin file
        id: get_version
        run: |
          VERSION=$(grep -m1 "Version:" deak-ter-gate.php | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check if release exists
        id: check_release
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v$VERSION already exists — skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v$VERSION does not exist — will create (even if the tag was pushed manually)"
          fi

      - name: Create release ZIP
        if: steps.check_release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          mkdir -p dist/deak-ter-gate
          rsync -av --exclude='.git' --exclude='.github' --exclude='dist' \
            --exclude='.gitignore' --exclude='.gitattributes' --exclude='README.md' \
            --exclude='test' --exclude='tests' --exclude='docs' --exclude='.claude' --exclude='.superpowers' \
            --exclude='*.log' . dist/deak-ter-gate/
          cd dist && zip -r "deak-ter-gate-${VERSION}.zip" deak-ter-gate/

      # The release body is the version's CHANGELOG.md entry.
      - name: Release notes
        if: steps.check_release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          {
            echo "## Deák Tér Gate v${VERSION}"
            echo
            echo "**Telepítés:** töltsd le a \`deak-ter-gate-${VERSION}.zip\` fájlt, majd WordPress admin → Bővítmények → Új hozzáadása → Bővítmény feltöltése, és aktiváld."
            echo
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
          } > dist/release-notes.md
          cat dist/release-notes.md

      - name: Create tag and release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          body_path: dist/release-notes.md
          files: |
            dist/deak-ter-gate-${{ steps.get_version.outputs.version }}.zip
          draft: false
          prerelease: false
          generate_release_notes: false
